<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1F3A5F">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>초자연재난관리기록일지 작성기</title>
<style>
@font-face{font-family:'KoPub Dotum';font-weight:400;src:url(fonts/KoPubDotum-Medium.woff) format('woff')}
@font-face{font-family:'KoPub Dotum';font-weight:700;src:url(fonts/KoPubDotum-Bold.woff) format('woff')}
@font-face{font-family:'KoPub Batang';font-weight:400;src:url(fonts/KoPubBatang-Medium.woff) format('woff')}
@font-face{font-family:'KoPub Batang';font-weight:700;src:url(fonts/KoPubBatang-Bold.woff) format('woff')}
:root{--ink:#1F3A5F;--gold:#B08D57;--bg:#E8ECF1;--line:#C5CEDA;--k:#111;--sh:#EEF1F5}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font:15px/1.4 'KoPub Dotum',system-ui,sans-serif;color:#1c2430}
.top{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line)}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:8px 14px}
h1{font-size:17px;margin:0 auto 0 0;color:var(--ink)}
button,select{font:inherit;height:34px;border:1px solid var(--line);background:#fff;border-radius:4px;padding:0 10px;color:#1c2430;cursor:pointer}
button:hover,select:hover{border-color:var(--ink)}
button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
button.main{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
button:disabled{opacity:.5;cursor:wait}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.tb{border-top:1px solid #E4E9F0}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
.sw{width:22px;height:22px;padding:0;border-radius:50%}
#color{width:34px;height:34px;padding:2px}
#warn{margin:0 14px 8px;padding:6px 10px;background:#FFF1E0;border-left:3px solid var(--gold);font-size:14px}
#stage{padding:18px 12px 60px}
#pages{display:flex;flex-direction:column;align-items:center;gap:18px}
.page{position:relative;width:1240px;height:1754px;transform-origin:0 0;background:#fff;box-shadow:0 6px 28px rgba(31,58,95,.25);color:var(--k)}
.tpl{position:absolute;inset:0;width:100%;height:100%;display:block}
.content{position:absolute;left:110px;right:110px;top:100px;bottom:100px;display:flex;flex-direction:column}
.pn{position:absolute;bottom:50px;left:0;right:0;text-align:center;font:400 20px 'KoPub Dotum',sans-serif;color:#6B7280}
.page [contenteditable]{outline:none;caret-color:var(--ink)}
.page:not(.cap) .sl:hover{background:rgba(31,58,95,.07)}
[data-ph]:empty:before{content:attr(data-ph);color:#9AA6B6}
.cap [data-ph]:empty:before,.cap .pb.em:before{content:none}
table{border-collapse:collapse;border:2px solid var(--k);table-layout:fixed;font-family:'KoPub Dotum',sans-serif}
th,td{border:1.5px solid var(--k);vertical-align:middle;text-align:center}
th{background:var(--sh);font-weight:700}
.hd{display:flex;align-items:center;gap:24px;margin-bottom:30px}
.ap{width:480px;flex:none}
.ap th{height:42px;font-size:22px}
.ap td{height:92px}
.ti{flex:1;min-width:0;font:700 42px/1.35 'KoPub Dotum',sans-serif;text-align:center;letter-spacing:.04em}
.info{width:100%}
.info th{width:150px;height:62px;font-size:22px}
.info td{font-size:24px;padding:0 14px}
.rh{margin-top:24px;height:56px;border:2px solid var(--k);background:var(--sh);text-align:center;font:700 26px/52px 'KoPub Dotum',sans-serif;letter-spacing:.3em}
.box{flex:1;min-height:0;border:2px solid var(--k);border-top:0;padding:24px 30px;display:flex;flex-direction:column}
.box.solo{border-top:2px solid var(--k)}
.pb{flex:1;min-height:0;position:relative;overflow:hidden;font:400 26px/1.75 'KoPub Batang',serif}
.pb.em:before{content:'보고 사항을 입력하세요';color:#9AA6B6;position:absolute;left:0;top:0}
.pb p,.pb div{margin:0 0 .6em}
.pb h2{font:700 32px/1.4 'KoPub Dotum',sans-serif;color:var(--ink);margin:1em 0 .4em}
.pb h3{font:700 27px/1.4 'KoPub Dotum',sans-serif;margin:.9em 0 .3em}
.pb ul,.pb ol{margin:0 0 .6em;padding-left:1.5em}
.ft{height:96px;margin-top:14px;display:flex;align-items:center;justify-content:center;gap:20px}
.ft img{height:var(--mh,70px);width:auto;max-width:320px;object-fit:contain;display:block}
.ft img[hidden]{display:none}
.ft.hm .fx:empty{display:none}
.fx{font:700 30px 'KoPub Dotum',sans-serif;letter-spacing:.08em;text-align:center;min-width:220px}
</style>
</head>
<body>
<div class="top">
  <div class="row"><h1>초자연재난관리기록일지 작성기</h1><button id="mkbtn">꼬리말 이미지 넣기</button><select id="mksz" title="이미지 크기" hidden><option value="50">작게</option><option value="70">보통</option><option value="90">크게</option></select><button id="mkdel" hidden>이미지 지우기</button><input type="file" id="mkf" accept="image/*" hidden>
    <button id="reset">처음부터 다시</button><button id="save" class="main">이미지로 저장</button></div>
  <div class="row tb" id="bar">
    <select id="blk" title="문단 종류"><option value="p">본문</option><option value="h2">소제목</option><option value="h3">작은 소제목</option></select>
    <select id="fam" title="글꼴"><option value="KoPub Batang">KoPub 바탕</option><option value="KoPub Dotum">KoPub 돋움</option></select>
    <select id="size" title="글자 크기"></select>
    <span class="sep"></span>
    <button data-cmd="bold" title="굵게"><b>B</b></button>
    <button data-cmd="italic" title="기울임"><i>I</i></button>
    <button data-cmd="underline" title="밑줄"><u>U</u></button>
    <span class="sep"></span>
    <button data-cmd="justifyLeft">왼쪽</button><button data-cmd="justifyCenter">가운데</button><button data-cmd="justifyRight">오른쪽</button><button data-cmd="justifyFull">양쪽</button>
    <span class="sep"></span>
    <input type="color" id="color" value="#111111" title="글자 색">
    <button class="sw" data-c="#111111" style="background:#111" title="검정"></button>
    <button class="sw" data-c="#1F3A5F" style="background:#1F3A5F" title="남색"></button>
    <button class="sw" data-c="#B3261E" style="background:#B3261E" title="빨강"></button>
    <button class="sw" data-c="#B08D57" style="background:#B08D57" title="금색"></button>
    <button class="sw" data-c="#2E7D32" style="background:#2E7D32" title="초록"></button>
    <button class="sw" data-c="#6B7280" style="background:#6B7280" title="회색"></button>
    <span class="sep"></span>
    <button data-cmd="insertUnorderedList">• 목록</button><button data-cmd="insertOrderedList">1. 목록</button>
    <span class="sep"></span>
    <button data-cmd="undo">되돌리기</button><button data-cmd="redo">다시</button>
  </div>
  <div id="warn" hidden>한 문단이 한 쪽보다 길어서 일부가 잘려요. 엔터로 문단을 나누거나 글을 줄여 주세요.</div>
</div>
<div id="stage"><div id="pages"></div></div>

function newPage(first){
  const w=document.createElement('div');w.className='pw';
  w.innerHTML=`<div class="page"><img class="tpl" src="${TEMPLATE}" alt=""><div class="content">${first?HEAD:''}<div class="box${first?'':' solo'}"><div class="pb" contenteditable="true"></div></div><div class="ft"><img class="mk" alt="" hidden><div class="fx sl" data-k="ft" data-ph="꼬리말 (기관명)"></div></div></div><div class="pn"></div></div>`;
  w.querySelectorAll('.sl').forEach(e=>{e.contentEditable=true;const k=e.dataset.k;e.textContent=k in F?F[k]:(DEF[k]||'')});
  const f0=P.querySelector('.fx'),f1=w.querySelector('.fx');if(f0)f1.textContent=f0.textContent; /* 하단 칸은 모든 쪽이 같은 문구 */
  P.appendChild(w);applyMark();fit();return w.querySelector('.pb');
}
function addPage(){return newPage(false)}

/* 화면 크기에 맞춰 축소 표시 (저장 이미지는 원본 크기 기준) */
function fit(){
  const s=Math.min(1,($('#stage').clientWidth-24)/1240);
  P.querySelectorAll('.pw').forEach(w=>{w.style.width=1240*s+'px';w.style.height=1754*s+'px';w.firstElementChild.style.transform=`scale(${s})`});
}
addEventListener('resize',fit);

/* 쪽 나누기: 넘치는 문단은 다음 쪽으로, 여유가 생기면 앞 쪽으로 되돌림 */
const used=pb=>{const l=pb.lastElementChild;return l?l.offsetTop+l.offsetHeight:0};
const BLK=/^(P|H[1-6]|UL|OL|DIV|BLOCKQUOTE)$/;
function reflow(){
  let mk=null;
  const mark=()=>{
    if(mk)return;const s=getSelection();if(!s.rangeCount)return;
    const r=s.getRangeAt(0).cloneRange();
    const el=r.startContainer.nodeType===1?r.startContainer:r.startContainer.parentElement;
    if(!el||!el.closest('.pb'))return;
    r.collapse(true);mk=document.createElement('span');r.insertNode(mk);
  };
  P.querySelectorAll('.pb').forEach(pb=>{
    [...pb.childNodes].forEach(n=>{if(!(n.nodeType===1&&BLK.test(n.tagName))&&(n.nodeType===1||n.textContent.trim())){mark();const p=document.createElement('p');pb.insertBefore(p,n);p.appendChild(n)}});
  });
  for(let g=0;g<300;g++){
    const a=[...P.querySelectorAll('.pb')];let did=false;
    for(let i=0;i<a.length&&!did;i++){
      const pb=a[i],n=a[i+1];
      if(used(pb)>pb.clientHeight+1&&pb.children.length>1){mark();const t=n||addPage();t.insertBefore(pb.lastElementChild,t.firstChild);did=true}
      else if(n&&n.firstElementChild&&pb.clientHeight-used(pb)>=n.firstElementChild.offsetHeight+60){mark();pb.appendChild(n.firstElementChild);did=true}
    }
    if(!did)break;
  }
  let a=[...P.querySelectorAll('.pb')];
  while(a.length>1&&!a[a.length-1].children.length){a.pop().closest('.pw').remove()}
  a.forEach((pb,i)=>{
    if(!pb.children.length)pb.innerHTML='<p><br></p>';
    pb.classList.toggle('em',pb.children.length<=1&&!pb.textContent.trim());
    pb.closest('.page').querySelector('.pn').textContent=`${i+1} / ${a.length}`;
  });
  if(mk){
    const el=mk.closest('.pb');
    if(el){el.focus({preventScroll:true});const r=document.createRange();r.setStartBefore(mk);r.collapse(true);const s=getSelection();s.removeAllRanges();s.addRange(r);mk.remove();el.normalize()}
    else mk.remove();
  }
  $('#warn').hidden=!a.some(pb=>used(pb)>pb.clientHeight+1);
  fit();
}

/* 선택 영역 기억 (툴바를 눌러도 선택이 풀리지 않게) */
let saved=null;
document.addEventListener('selectionchange',()=>{
  const s=getSelection();
  if(s.rangeCount&&P.contains(s.anchorNode)){saved=s.getRangeAt(0).cloneRange();state()}
});
const elOf=r=>{const n=r.commonAncestorContainer;return n.nodeType===1?n:n.parentElement};
function restore(){
  if(!saved)return false;
  const el=elOf(saved).closest('[contenteditable]');if(!el)return false;
  el.focus({preventScroll:true});
  const s=getSelection();s.removeAllRanges();s.addRange(saved);return true;
}
const inBody=()=>saved&&elOf(saved).closest('.pb');
function run(cmd,val,css=true){
  if(!restore())return;
  if(/^(formatBlock|insert(Un)?orderedList)$/.test(cmd)&&!inBody())return;
  document.execCommand('styleWithCSS',false,css);
  document.execCommand(cmd,false,val);
  reflow();persist();state();
}
function state(){
  bar.querySelectorAll('button[data-cmd]').forEach(b=>{let on=false;try{on=document.queryCommandState(b.dataset.cmd)}catch(e){}b.classList.toggle('on',on&&!/^(undo|redo)$/.test(b.dataset.cmd))});
  let v='p';try{v=(document.queryCommandValue('formatBlock')||'p').toLowerCase()}catch(e){}
  $('#blk').value=/^h[23]$/.test(v)?v:'p';
}

/* 이미지로 저장: 1쪽이면 PNG, 여러 쪽이면 ZIP */
const dl=(b,n)=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=n;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000)};
$('#save').onclick=async()=>{
  const btn=$('#save'),pages=[...P.querySelectorAll('.page')];
  btn.disabled=true;btn.textContent='만드는 중…';
  try{
    await document.fonts.ready;
    getSelection().removeAllRanges();if(document.activeElement)document.activeElement.blur();
    pages.forEach(p=>p.classList.add('cap')); /* 편집용 표시는 캡처 전에 숨김 */
    const blobs=[];
    for(const p of pages){
      const c=await html2canvas(p,{scale:2,backgroundColor:null,useCORS:true,width:1240,height:1754,windowWidth:1240,
        onclone:d=>{d.querySelectorAll('.page').forEach(x=>x.style.transform='none');d.querySelectorAll('.pw').forEach(x=>{x.style.width='1240px';x.style.height='1754px'})}});
      blobs.push(await new Promise(r=>c.toBlob(r,'image/png')));
    }
    const d=new Date(),base='기록일지_'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0');
    if(blobs.length===1)dl(blobs[0],base+'.png');
    else{const z=new JSZip();blobs.forEach((b,i)=>z.file(`${base}_${i+1}쪽.png`,b));dl(await z.generateAsync({type:'blob'}),base+'.zip')}
  }catch(err){
    alert('이미지 저장에 실패했어요.\n파일을 더블클릭해서 열었다면, 로컬 서버나 호스팅(GitHub Pages 등)으로 열어 주세요.\n\n'+err.message);
  }finally{pages.forEach(p=>p.classList.remove('cap'));btn.disabled=false;btn.textContent='이미지로 저장'}
};

}

$('#mkf').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const h=Math.min(240,im.naturalHeight),w=Math.round(im.naturalWidth*h/im.naturalHeight),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);MK=c.toDataURL('image/png');URL.revokeObjectURL(u);applyMark();persist()};
  im.onerror=()=>alert('이미지를 불러오지 못했어요.');
  im.src=u;e.target.value='';
};
$('#mkdel').onclick=()=>{MK='';applyMark();persist()};
$('#mksz').onchange=e=>{MH=+e.target.value;applyMark();persist()};

/* 휴대폰 설치용(PWA): 인터넷 주소(https)로 열었을 때만 등록 */
if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
